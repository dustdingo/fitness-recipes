<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Recipes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f4f4f0;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: #1a2e1a;
    color: white;
    padding: 24px 32px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  header p  { font-size: 12px; color: #8aab8a; margin-top: 4px; }

  /* ── Controls ── */
  .controls {
    background: white;
    border-bottom: 1px solid #e4e4e4;
    padding: 14px 32px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .search-wrap { flex: 1; min-width: 180px; }
  input[type="search"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    background: #fafafa;
  }
  input[type="search"]:focus { border-color: #3a6b3a; background: white; }
  select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    background: white;
    outline: none;
    cursor: pointer;
    color: #333;
  }
  select:focus { border-color: #3a6b3a; }
  .count { font-size: 12px; color: #999; white-space: nowrap; margin-left: auto; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 14px;
    padding: 24px 32px;
    max-width: 1300px;
    margin: 0 auto;
  }

  /* ── Card ── */
  .card {
    background: white;
    border-radius: 10px;
    border: 1px solid #e4e4e4;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.12s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.09); transform: translateY(-1px); }

  .card-header { padding: 16px 18px 14px; }

  .card-top-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }
  .card-title {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: #111;
    line-height: 1.35;
  }

  /* ── Favorite button ── */
  .fav-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 17px;
    color: #ddd;
    padding: 0 1px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.1s;
  }
  .fav-btn:hover              { color: #f5a623; transform: scale(1.15); }
  .fav-btn.fav-active         { color: #f5a623; }

  /* ── Macros ── */
  .macros { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 99px;
    letter-spacing: 0.01em;
  }
  .pill-cal  { background: #f0f0f0; color: #555; }
  .pill-pro  { background: #dbeafe; color: #1e40af; }
  .pill-carb { background: #fef3c7; color: #92400e; }
  .pill-fat  { background: #fce7f3; color: #9d174d; }

  .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; }
  .view-hint { font-size: 11px; font-weight: 600; color: #3a6b3a; }

  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #bbb; font-size: 14px; }

  /* ── Full-screen Overlay ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: white;
    z-index: 50;
    flex-direction: column;
  }
  .overlay.open { display: flex; }

  .overlay-bar {
    display: flex;
    align-items: center;
    padding: 14px 20px 14px 24px;
    border-bottom: 1px solid #e4e4e4;
    background: white;
    flex-shrink: 0;
    gap: 12px;
  }
  .overlay-bar-title {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    color: #111;
    line-height: 1.3;
  }
  .overlay-fav-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    color: #ddd;
    transition: color 0.15s, transform 0.1s;
    padding: 0 2px;
    flex-shrink: 0;
    line-height: 1;
  }
  .overlay-fav-btn:hover      { color: #f5a623; transform: scale(1.1); }
  .overlay-fav-btn.fav-active { color: #f5a623; }

  .overlay-close-btn {
    background: none;
    border: 1px solid #e0e0e0;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 15px;
    cursor: pointer;
    color: #555;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .overlay-close-btn:hover { background: #f5f5f5; border-color: #ccc; }

  .overlay-body {
    overflow-y: auto;
    flex: 1;
    padding: 28px 32px 56px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .overlay-macros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .overlay-serving { font-size: 12px; color: #888; margin-bottom: 8px; }

  /* ── Video ── */
  .video-wrap {
    display: none;
    margin: 20px 0 4px;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .video-wrap video {
    width: 100%;
    display: block;
    max-height: 440px;
  }

  /* ── Recipe sections ── */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #3a6b3a;
    margin: 22px 0 8px;
  }

  .ingredients-list {
    list-style: none;
    font-size: 14px;
    line-height: 1.8;
    color: #333;
  }
  .ingredients-list li { padding-left: 16px; position: relative; }
  .ingredients-list li::before { content: "·"; position: absolute; left: 0; color: #bbb; }

  .method-list {
    list-style: none;
    counter-reset: step;
    font-size: 14px;
    color: #333;
  }
  .method-list li {
    counter-increment: step;
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .method-list li::before {
    content: counter(step);
    background: #1a2e1a;
    color: white;
    font-size: 10px;
    font-weight: 700;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .notes-box {
    background: #f6faf6;
    border-left: 3px solid #3a6b3a;
    padding: 10px 14px;
    font-size: 13px;
    color: #444;
    border-radius: 0 4px 4px 0;
    line-height: 1.6;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 18px 16px; }
    .controls { padding: 12px 16px; }
    .grid { grid-template-columns: 1fr; padding: 14px 16px; }
    .overlay-body { padding: 20px 16px 48px; }
    .overlay-bar { padding: 12px 16px; }
    .overlay-bar-title { font-size: 13px; }
  }

  @media print {
    header { background: #1a2e1a !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .controls, .overlay { display: none !important; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
    .card { break-inside: avoid; box-shadow: none !important; border: 1px solid #ddd; }
  }
</style>
</head>

</div>

/* ── Favorites ── */
const FAV_KEY = 'rfavs';
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
  catch(e) { return []; }
}
function isFav(title) { return getFavs().includes(title); }
function toggleFav(title) {
  const favs = getFavs();
  const idx  = favs.indexOf(title);
  if (idx >= 0) favs.splice(idx, 1); else favs.push(title);
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
}

/* ── Video slug ── */
function toSlug(title) {
  return title.toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, '_')
    .replace(/_+/g, '_')
    .trim();
}

/* ── Overlay ── */
let currentRecipe = null;

function openOverlay(recipe) {
  currentRecipe = recipe;

  // Bar
  document.getElementById('overlay-bar-title').textContent = recipe.title;
  const ofavBtn = document.getElementById('overlay-fav-btn');
  ofavBtn.classList.toggle('fav-active', isFav(recipe.title));

  // Macros + serving
  document.getElementById('overlay-macros').innerHTML = `
    <span class="pill pill-cal">${recipe.calories} cal</span>
    <span class="pill pill-pro">${recipe.protein}g protein</span>
    <span class="pill pill-carb">${recipe.carbs}g carbs</span>
    <span class="pill pill-fat">${recipe.fat}g fat</span>
  `;
  document.getElementById('overlay-serving').textContent = `Serves ${recipe.servings}`;

  // Video
  const videoEl  = document.getElementById('overlay-video');
  const videoWrap = document.getElementById('video-wrap');
  videoWrap.style.display = 'none';
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
  videoEl.src = `videos/${toSlug(recipe.title)}.mp4`;
  videoEl.onloadedmetadata = () => { videoWrap.style.display = 'block'; };
  videoEl.onerror = () => { videoWrap.style.display = 'none'; };
  videoEl.load();

  // Body content
  document.getElementById('overlay-content').innerHTML = `
    <div class="section-label">Ingredients</div>
    <ul class="ingredients-list">${recipe.ingredients.map(x => `<li>${x}</li>`).join('')}</ul>
    <div class="section-label">Method</div>
    <ol class="method-list">${recipe.method.map(x => `<li><span>${x}</span></li>`).join('')}</ol>
    ${recipe.notes ? `<div class="section-label">Notes</div><div class="notes-box">${recipe.notes}</div>` : ''}
  `;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('overlay-body').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  const videoEl = document.getElementById('overlay-video');
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
  currentRecipe = null;
}

document.getElementById('overlay-close-btn').addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

document.getElementById('overlay-fav-btn').addEventListener('click', () => {
  if (!currentRecipe) return;
  toggleFav(currentRecipe.title);
  const fav = isFav(currentRecipe.title);
  document.getElementById('overlay-fav-btn').classList.toggle('fav-active', fav);
  render();
});

/* ── Grid rendering ── */
const grid    = document.getElementById('grid');
const searchEl = document.getElementById('search');
const sortEl  = document.getElementById('sort');
const fpEl    = document.getElementById('filter-protein');
const fcEl    = document.getElementById('filter-cal');
const countEl = document.getElementById('count');

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  const q       = searchEl.value.toLowerCase().trim();
  const minPro  = parseInt(fpEl.value)  || 0;
  const maxCal  = parseInt(fcEl.value)  || 9999;
  const sortVal = sortEl.value;
  const favs    = getFavs();

  let list = RECIPES.filter(r => {
    if (q && !r.title.toLowerCase().includes(q)) return false;
    if (minPro && r.protein < minPro)             return false;
    if (maxCal < 9999 && r.calories >= maxCal)    return false;
    return true;
  });

  list.sort((a, b) => {
    // Favorites always float to top
    const af = favs.includes(a.title) ? 0 : 1;
    const bf = favs.includes(b.title) ? 0 : 1;
    if (af !== bf) return af - bf;
    // Within same group, apply chosen sort
    if (sortVal === 'name')         return a.title.localeCompare(b.title);
    if (sortVal === 'protein-desc') return b.protein  - a.protein;
    if (sortVal === 'protein-asc')  return a.protein  - b.protein;
    if (sortVal === 'cal-asc')      return a.calories - b.calories;
    if (sortVal === 'cal-desc')     return b.calories - a.calories;
    return 0;
  });

  countEl.textContent = `${list.length} recipe${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty">No recipes match your filters.</div>';
    return;
  }

  grid.innerHTML = list.map(r => {
    const fav = favs.includes(r.title);
    return `
      <div class="card" data-title="${esc(r.title)}">
        <div class="card-header">
          <div class="card-top-row">
            <div class="card-title">${r.title}</div>
            <button class="fav-btn${fav ? ' fav-active' : ''}" data-title="${esc(r.title)}"
              title="${fav ? 'Remove from favorites' : 'Add to favorites'}">&#9733;</button>
          </div>
          <div class="macros">
            <span class="pill pill-cal">${r.calories} cal</span>
            <span class="pill pill-pro">${r.protein}g protein</span>
            <span class="pill pill-carb">${r.carbs}g carbs</span>
            <span class="pill pill-fat">${r.fat}g fat</span>
          </div>
          <div class="card-meta">
            <span>Serves ${r.servings}</span>
            <span class="view-hint">View recipe &rarr;</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// Event delegation
grid.addEventListener('click', e => {
  const favBtn = e.target.closest('.fav-btn');
  if (favBtn) {
    e.stopPropagation();
    const title = favBtn.dataset.title;
    toggleFav(title);
    const fav = isFav(title);
    favBtn.classList.toggle('fav-active', fav);
    favBtn.title = fav ? 'Remove from favorites' : 'Add to favorites';
    render();
    return;
  }
  const card = e.target.closest('.card');
  if (card) {
    const recipe = RECIPES.find(r => r.title === card.dataset.title);
    if (recipe) openOverlay(recipe);
  }
});

searchEl.addEventListener('input', render);
sortEl.addEventListener('change', render);
fpEl.addEventListener('change', render);
fcEl.addEventListener('change', render);

const GENERATED = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
document.getElementById('subtitle').textContent = `${RECIPES.length} recipes · Last updated ${GENERATED}`;

render();
</script>
