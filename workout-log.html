<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Log">
<meta name="theme-color" content="#ffffff">
<title>Evan's Workout Plan — Log</title>
<style>
  :root{
    --bg:#FFFFFF;
    --border:#E9E9E9;
    --border-light:#F0F0F0;
    --text:#16181D;
    --text-muted:#6B7280;
    --text-faint:#9CA3AF;
    --blue:#2E5090;
    --blue-bg:#EEF3FB;
    --green:#3B6D11;
    --green-bg:#EEF5E4;
    --amber:#92400E;
    --amber-bg:#FFF9EC;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 16px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
  }
  .header{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 0;
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .header-title{font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .header-date{font-size:12.5px;color:var(--text-faint);margin-top:1px;}
  .header-actions{display:flex;gap:8px;}
  .icon-btn{
    border:1px solid var(--border);background:#fff;border-radius:8px;
    padding:6px 10px;font-size:12.5px;color:var(--text-muted);font-weight:600;
  }
  .tabs{display:flex;gap:4px;padding-bottom:0;}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:8px 4px 10px;border-bottom:2px solid transparent;
  }
  .tab-label{font-size:14.5px;font-weight:600;color:var(--text-muted);}
  .tab-sub{font-size:11px;font-weight:500;color:var(--text-faint);margin-top:1px;}
  .tab.active{border-bottom-color:var(--blue);}
  .tab.active .tab-label{color:var(--blue);}
  .tab.active .tab-sub{color:var(--blue);opacity:.7;}
  .pane{display:none;padding:16px;}
  .pane.active{display:block;}
  .part{margin-bottom:22px;}
  .part-title{
    font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:10px;padding-left:2px;
  }
  .exercise{
    background:#fff;border:1px solid var(--border);border-radius:12px;
    padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .ex-name{font-size:15.5px;font-weight:700;color:var(--text);}
  .ex-hint{font-size:12.5px;color:var(--text-faint);margin-top:2px;margin-bottom:8px;line-height:1.4;}
  .ex-last{font-size:12.5px;color:var(--blue);margin-bottom:10px;font-weight:600;}
  .ex-last.empty{color:var(--text-faint);font-weight:500;}
  .set-row{
    display:grid;grid-template-columns:44px 1fr 14px 1fr;align-items:center;gap:8px;
    padding:5px 0;
  }
  .set-label{font-size:12.5px;color:var(--text-faint);font-weight:600;}
  .x-sep{font-size:12px;color:var(--text-faint);text-align:center;}
  input[type="number"]{
    width:100%;border:1px solid var(--border);border-radius:8px;
    padding:8px 8px;font-size:16px;color:var(--text);background:#FAFAFA;
    text-align:center;-moz-appearance:textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type="number"]:focus{outline:none;border-color:var(--blue);background:#fff;}
  .saved-flash{
    display:inline-block;font-size:11px;color:var(--green);font-weight:700;
    margin-left:6px;opacity:0;transition:opacity .3s;
  }
  .saved-flash.show{opacity:1;}

  /* Timer FAB */
  #timerFab{
    position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:64px;height:64px;border-radius:50%;
    background:var(--blue);color:#fff;border:none;
    box-shadow:0 4px 14px rgba(46,80,144,.4);
    font-size:13px;font-weight:700;line-height:1.2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:20;
  }
  #timerFab.running{background:var(--amber);box-shadow:0 4px 14px rgba(146,64,14,.4);}
  #timerFab.done{background:var(--green);box-shadow:0 4px 14px rgba(59,109,17,.4);}
  #timerFab .fab-icon{font-size:18px;}

  .footer-note{
    text-align:center;font-size:11.5px;color:var(--text-faint);padding:18px 20px 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Workout Log</div>
      <div class="header-date" id="todayLabel"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="backupBtn">Backup</button>
      <button class="icon-btn" id="restoreBtn">Restore</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="day1">
      <div class="tab-label">Day 1</div>
      <div class="tab-sub">Chest / Biceps</div>
    </div>
    <div class="tab" data-tab="day2">
      <div class="tab-label">Day 2</div>
      <div class="tab-sub">Back / Triceps</div>
    </div>
    <div class="tab" data-tab="day3">
      <div class="tab-label">Day 3</div>
      <div class="tab-sub">Legs / Shoulders</div>
    </div>
  </div>
</div>

<div id="paneContainer"></div>

<div class="footer-note">Pick 3 exercises per section each session. Numbers autosave as you type.</div>

<button id="timerFab">
  <span class="fab-icon" id="fabIcon">⏱</span>
  <span id="fabLabel">90s</span>
</button>

<input type="file" id="restoreFile" accept="application/json" style="display:none">

<script>
  // ---------- Plan data ----------
  const PLAN = {
    day1: { label: "Day 1", parts: [
      { title: "Part 1: Chest", exercises: [
        {id:"d1p1-flat-barbell-bench", name:"Flat Barbell Bench", hint:"Suggested 10-15 lbs/side (last noted 30 lbs/side)"},
        {id:"d1p1-incline-barbell-bench", name:"Incline Barbell Bench", hint:"Suggested 10 lbs/side (last noted 15-20 lbs)"},
        {id:"d1p1-flat-dumbbell-bench", name:"Flat Dumbbell Bench", hint:"20-25 lb dumbbells (last noted ~40s)"},
        {id:"d1p1-incline-dumbbell-bench", name:"Incline Dumbbell Bench", hint:"20-25 lb dumbbells"},
        {id:"d1p1-flat-dumbbell-flys", name:"Flat Dumbbell Flys", hint:"10-20 lb dumbbells"},
        {id:"d1p1-incline-dumbbell-flys", name:"Incline Dumbbell Flys", hint:"10-20 lb dumbbells"}
      ]},
      { title: "Part 2: Biceps", exercises: [
        {id:"d1p2-standing-alt-curls", name:"Standing Alternate Arm Curls", hint:"10-15 lbs (last noted 25 lbs)"},
        {id:"d1p2-incline-hammer-curls", name:"Incline Hammer Curls", hint:"10-15 lbs"},
        {id:"d1p2-easy-bar-curls", name:"Easy Bar Curls", hint:"5-10 lbs/side"},
        {id:"d1p2-barbell-curls", name:"Barbell Curls", hint:"Just the bar (45 lbs)"},
        {id:"d1p2-concentration-curls", name:"Concentration Curls", hint:"10-15 lbs"}
      ]}
    ]},
    day2: { label: "Day 2", parts: [
      { title: "Part 1: Back", exercises: [
        {id:"d2p1-wide-grip-lat-pulldown", name:"Wide Grip Lat Pulldowns", hint:"50-60 lbs (last noted 70 lbs)"},
        {id:"d2p1-reverse-close-grip-lat-pulldown", name:"Reverse Close Grip Lat Pulldowns", hint:"60-70 lbs"},
        {id:"d2p1-v-bar-lat-pulldown", name:"V-bar Lat Pulldowns", hint:"60-70 lbs"},
        {id:"d2p1-bent-over-rows", name:"Bent Over Rows", hint:"10-15 lbs/side"},
        {id:"d2p1-dumbbell-pullovers", name:"Dumbbell Pullovers", hint:"20 lbs (last noted 35 lbs)"},
        {id:"d2p1-one-arm-rows", name:"One Arm Rows", hint:"What Jay did"}
      ]},
      { title: "Part 2: Triceps", exercises: [
        {id:"d2p2-behind-head-db-press", name:"Behind the Head Dumbbell Press", hint:"20-25 lbs (last noted 35 lbs)"},
        {id:"d2p2-close-grip-barbell-press", name:"Close Grip Barbell Press", hint:"10 lbs/side"},
        {id:"d2p2-tricep-dips", name:"Tricep Dips", hint:"Bodyweight"},
        {id:"d2p2-tricep-pressdowns", name:"Tricep Pressdowns", hint:"Golf stance, elbows at side"},
        {id:"d2p2-skull-crushers", name:"Skull Crushers", hint:"5 lbs/side, be careful"},
        {id:"d2p2-reverse-grip-triceps-bench", name:"Reverse Grip Triceps Bench", hint:"17.5 lbs"}
      ]}
    ]},
    day3: { label: "Day 3", parts: [
      { title: "Part 1: Legs", exercises: [
        {id:"d3p1-leg-extensions", name:"Leg Extensions", hint:"Last noted 70 lbs"},
        {id:"d3p1-leg-press", name:"Leg Press", hint:"Regular / high / low / wide / close stance"},
        {id:"d3p1-stiff-leg-deadlifts", name:"Stiff Leg Dead Lifts", hint:"15 lbs/side — increase slowly"}
      ]},
      { title: "Part 2: Shoulders", exercises: [
        {id:"d3p2-front-raises", name:"Front Raises", hint:"10 lbs (last noted 25 lb plate)"},
        {id:"d3p2-side-laterals", name:"Side Laterals", hint:"10 lbs"},
        {id:"d3p2-upright-rows", name:"Dumbbell Upright Rows", hint:"15-20 lbs"},
        {id:"d3p2-shrugs", name:"Shrugs", hint:"Last noted 45 lbs"},
        {id:"d3p2-dumbbell-press", name:"Dumbbell Press", hint:""}
      ]}
    ]}
  };

  // ---------- Storage ----------
  const STORAGE_KEY = "evanWorkoutLog";
  function loadLog(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveLog(log){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  }
  let LOG = loadLog();

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function prettyDate(str){
    const [y,m,d] = str.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString("en-US", {month:"short", day:"numeric"});
  }

  const TODAY = todayStr();
  document.getElementById("todayLabel").textContent =
    "Today — " + new Date().toLocaleDateString("en-US", {weekday:"long", month:"long", day:"numeric"});

  function getExerciseHistory(id){
    return (LOG[id] && LOG[id].history) || [];
  }
  function getLastEntry(id){
    const hist = getExerciseHistory(id).filter(e => e.date !== TODAY);
    if (!hist.length) return null;
    return hist[hist.length - 1];
  }
  function getTodayEntry(id){
    return getExerciseHistory(id).find(e => e.date === TODAY) || null;
  }
  function upsertToday(id, sets){
    if (!LOG[id]) LOG[id] = { history: [] };
    const hist = LOG[id].history;
    const idx = hist.findIndex(e => e.date === TODAY);
    const entry = { date: TODAY, sets };
    if (idx >= 0) hist[idx] = entry; else hist.push(entry);
    saveLog(LOG);
  }

  // ---------- Render ----------
  const container = document.getElementById("paneContainer");

  function formatLast(entry){
    if (!entry) return null;
    const parts = entry.sets
      .filter(s => s.weight !== "" && s.weight != null || s.reps !== "" && s.reps != null)
      .map(s => `${s.reps || "-"}x${s.weight || "-"}`);
    if (!parts.length) return null;
    return `Last (${prettyDate(entry.date)}): ${parts.join(" · ")}`;
  }

  Object.keys(PLAN).forEach((dayKey, i) => {
    const day = PLAN[dayKey];
    const pane = document.createElement("div");
    pane.className = "pane" + (i === 0 ? " active" : "");
    pane.id = dayKey;

    day.parts.forEach(part => {
      const partEl = document.createElement("div");
      partEl.className = "part";
      const partTitle = document.createElement("div");
      partTitle.className = "part-title";
      partTitle.textContent = part.title;
      partEl.appendChild(partTitle);

      part.exercises.forEach(ex => {
        const card = document.createElement("div");
        card.className = "exercise";
        card.dataset.id = ex.id;

        const nameEl = document.createElement("div");
        nameEl.className = "ex-name";
        nameEl.textContent = ex.name;
        card.appendChild(nameEl);

        if (ex.hint){
          const hintEl = document.createElement("div");
          hintEl.className = "ex-hint";
          hintEl.textContent = ex.hint;
          card.appendChild(hintEl);
        }

        const lastEl = document.createElement("div");
        lastEl.className = "ex-last";
        lastEl.id = "last-" + ex.id;
        const lastEntry = getLastEntry(ex.id);
        const lastText = formatLast(lastEntry);
        lastEl.textContent = lastText || "No previous log yet";
        if (!lastText) lastEl.classList.add("empty");
        card.appendChild(lastEl);

        const todayEntry = getTodayEntry(ex.id);
        for (let s = 0; s < 3; s++){
          const row = document.createElement("div");
          row.className = "set-row";

          const label = document.createElement("div");
          label.className = "set-label";
          label.textContent = "Set " + (s+1);
          row.appendChild(label);

          const rInput = document.createElement("input");
          rInput.type = "number";
          rInput.inputMode = "numeric";
          rInput.placeholder = "reps";
          rInput.dataset.set = s;
          rInput.dataset.field = "reps";
          if (todayEntry && todayEntry.sets[s]) rInput.value = todayEntry.sets[s].reps ?? "";
          row.appendChild(rInput);

          const xSep = document.createElement("div");
          xSep.className = "x-sep";
          xSep.textContent = "×";
          row.appendChild(xSep);

          const wInput = document.createElement("input");
          wInput.type = "number";
          wInput.inputMode = "decimal";
          wInput.placeholder = "lbs";
          wInput.dataset.set = s;
          wInput.dataset.field = "weight";
          if (todayEntry && todayEntry.sets[s]) wInput.value = todayEntry.sets[s].weight ?? "";
          row.appendChild(wInput);

          card.appendChild(row);
        }

        card.addEventListener("input", () => saveExerciseFromCard(card, ex.id));
        partEl.appendChild(card);
      });

      pane.appendChild(partEl);
    });

    container.appendChild(pane);
  });

  function saveExerciseFromCard(card, id){
    const sets = [0,1,2].map(s => {
      const w = card.querySelector(`input[data-set="${s}"][data-field="weight"]`).value;
      const r = card.querySelector(`input[data-set="${s}"][data-field="reps"]`).value;
      return { weight: w, reps: r };
    });
    upsertToday(id, sets);
  }

  // ---------- Tabs ----------
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
    });
  });

  // ---------- Rest timer (90s, floating button) ----------
  const fab = document.getElementById("timerFab");
  const fabIcon = document.getElementById("fabIcon");
  const fabLabel = document.getElementById("fabLabel");
  const REST_SECONDS = 90;
  let timerInterval = null;
  let remaining = REST_SECONDS;
  let audioCtx = null;

  function beep(freq, duration, delay){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  }
  function playDoneSound(){
    beep(880, 0.15, 0);
    beep(880, 0.15, 0.25);
    beep(880, 0.25, 0.5);
  }
  function formatTime(sec){
    const m = Math.floor(sec/60);
    const s = sec % 60;
    return m + ":" + String(s).padStart(2,"0");
  }
  function resetFab(){
    fab.classList.remove("running","done");
    fabIcon.textContent = "⏱";
    fabLabel.textContent = "90s";
  }
  function startTimer(){
    clearInterval(timerInterval);
    remaining = REST_SECONDS;
    fab.classList.remove("done");
    fab.classList.add("running");
    fabIcon.textContent = "⏸";
    fabLabel.textContent = formatTime(remaining);
    timerInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0){
        clearInterval(timerInterval);
        fab.classList.remove("running");
        fab.classList.add("done");
        fabIcon.textContent = "✓";
        fabLabel.textContent = "Rest up";
        playDoneSound();
        setTimeout(resetFab, 3000);
      } else {
        fabLabel.textContent = formatTime(remaining);
      }
    }, 1000);
  }
  fab.addEventListener("click", () => {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    // tap always (re)starts a fresh 90s countdown; tap while running cancels back to idle
    if (timerInterval){
      clearInterval(timerInterval);
      timerInterval = null;
      resetFab();
    } else {
      startTimer();
    }
  });

  // ---------- Backup / Restore ----------
  document.getElementById("backupBtn").addEventListener("click", async () => {
    const data = JSON.stringify(LOG, null, 2);
    const filename = `evan-workout-log-backup-${TODAY}.json`;
    const blob = new Blob([data], {type: "application/json"});
    const file = new File([blob], filename, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      try {
        await navigator.share({files: [file], title: "Workout Log Backup"});
        return;
      } catch(e) { /* user cancelled or share failed, fall through to download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("restoreBtn").addEventListener("click", () => {
    document.getElementById("restoreFile").click();
  });
  document.getElementById("restoreFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        LOG = parsed;
        saveLog(LOG);
        alert("Restored. Reloading...");
        location.reload();
      } catch(err){
        alert("That file didn't look like a valid backup.");
      }
    };
    reader.readAsText(file);
  });
</script>
</body>
</html>
